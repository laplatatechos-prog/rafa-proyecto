<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa en Orden</title>
<meta name="theme-color" content="#6c4fe0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>/* Layout: app de una columna, botones grandes de colores por sección, detalle en hojas que suben desde abajo */
:root{
  --bg:#f6f4ff;--surface:#ffffff;--surface2:#efecfb;--ink:#2b2a4c;--muted:#6b6990;--line:#e4e0f5;
  --accent:#6c4fe0;--accent-ink:#ffffff;
  --mint:#d4f4e4;--mint-i:#0f6e45;--sky:#d8ebff;--sky-i:#1b5ca3;--sun:#fff0bf;--sun-i:#855600;--peach:#ffe0cf;--peach-i:#a1420f;--lila:#e8e0ff;--lila-i:#5537b0;--rose:#ffd9e3;--rose-i:#a8204c;--tink:#2b2a4c;--tink-i:#ffffff;
  --good:#12804e;--bad:#c42b55;
  --f-display:"Fredoka",ui-rounded,"Nunito",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px;
}
:root{color-scheme:only light}html,body{background:#f6f4ff;forced-color-adjust:none}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.c-mint{background:var(--mint);color:var(--mint-i)}.c-sky{background:var(--sky);color:var(--sky-i)}.c-sun{background:var(--sun);color:var(--sun-i)}
.c-peach{background:var(--peach);color:var(--peach-i)}.c-lila{background:var(--lila);color:var(--lila-i)}.c-rose{background:var(--rose);color:var(--rose-i)}.c-ink{background:var(--tink);color:var(--tink-i)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;text-wrap:balance}
.logo{width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);flex:none}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:0 1px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:20px}
.round.sm{width:34px;height:34px;font-size:15px}
.help{background:var(--sun);color:var(--sun-i)}
main.pg{display:flex;flex-direction:column;gap:14px;padding-block:4px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero-t{font-size:14px;opacity:.85;text-transform:capitalize}
.hero-b{background:rgba(255,255,255,.16);border:0;border-radius:18px;padding:14px 16px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.hero-b b{font-family:var(--f-display);font-weight:600;font-size:21px}
.hero-b span{font-size:14px;opacity:.9}
.hero-b.ok{cursor:default}
.hero-s{background:none;border:0;color:inherit;display:flex;align-items:center;gap:8px;font-size:14.5px;text-align:left;cursor:pointer;padding:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:0;border-radius:var(--r);padding:16px 14px 14px;min-height:118px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ico{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.c-ink .ico{background:rgba(255,255,255,.14)}
.tile .tl{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15}
.tile .ts{font-size:13px;opacity:.85}
.badge{position:absolute;top:12px;right:12px;min-width:26px;height:26px;border-radius:13px;background:var(--bad);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.cta{border:0;border-radius:18px;padding:16px;font-family:var(--f-display);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;width:100%}
.cta.soft{background:var(--surface);color:var(--accent);border:2px dashed var(--line);font-size:16px}
.blk{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.blk h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:2px 2px 2px}
.item{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface2);border:0;border-radius:16px;padding:11px 12px;text-align:left;cursor:pointer;min-width:0}
.dot{width:40px;height:40px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.it{flex:1;min-width:0;display:flex;flex-direction:column}
.it b{font-weight:700;overflow-wrap:anywhere}
.it small{color:var(--muted);font-size:13px}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chev{color:var(--muted);font-size:22px;line-height:1}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.amt.pos{color:var(--good)}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--surface);color:var(--muted);white-space:nowrap}
.item .chip{background:var(--surface)}
.item .chip.c-mint,.item .chip.c-sun,.item .chip.c-rose,.item .chip.c-peach{background:var(--surface)}
.chip.c-mint{color:var(--mint-i);background:var(--mint)}.chip.c-sun{color:var(--sun-i);background:var(--sun)}.chip.c-rose{color:var(--rose-i);background:var(--rose)}.chip.c-peach{color:var(--peach-i);background:var(--peach)}
.vacio{text-align:center;color:var(--muted);padding:14px 8px}.vacio p{margin:0}
.task{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:16px;padding:10px 12px}
.task .chk{width:40px;height:40px;border-radius:50%;border:3px solid var(--mint-i);background:var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.task .chk:disabled{opacity:.4;cursor:default}
.task.done .chk{background:var(--good);border-color:var(--good)}
.task.done .task-t b{text-decoration:line-through;opacity:.6}
.task-t{flex:1;min-width:0;background:none;border:0;text-align:left;display:flex;flex-direction:column;cursor:pointer;padding:0}
.task-t b{font-weight:700}.task-t small{color:var(--muted);font-size:13px}
.pts{display:flex;align-items:center;gap:10px}.pts span{width:96px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.pts .bar{flex:1;margin:0}.pts b{width:36px;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:block;height:12px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--mint-i));border-radius:8px}
.bar.sm{height:7px;width:120px;margin-top:4px}
.numero{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:2px}
.numero small{font-size:14px;font-weight:700}
.numero b{font-family:var(--f-display);font-weight:600;font-size:36px;font-variant-numeric:tabular-nums}
.numero b.neg{color:var(--bad)}.numero span{font-size:13.5px;opacity:.85}
.meta{background:var(--surface2);border:0;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;width:100%}
.meta-t{display:flex;justify-content:space-between;gap:8px}.meta-t b{font-weight:700}.meta-t span{font-weight:800;color:var(--accent)}
.meta small{color:var(--muted);font-size:13px;margin-top:4px}
.aviso{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700}
.cal-blk{gap:10px}
.calh{display:flex;justify-content:space-between;align-items:center}.calh b{font-family:var(--f-display);font-weight:600;font-size:19px;text-transform:capitalize}
.calh .round{background:var(--surface2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dn{font-size:12px;font-weight:800;color:var(--muted)}
.cal button{border:0;background:var(--surface2);border-radius:12px;min-height:46px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.35}.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:3px;height:6px}.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--sky-i)}
.cal .dots i.p{background:var(--peach-i)}.cal .dots i.b{background:var(--lila-i)}.cal button.sel .dots i{background:var(--accent-ink)}
.gente{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.persona{background:var(--surface2);border:0;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;min-width:0}
.persona span{display:flex;flex-direction:column;min-width:0}.persona b{overflow:hidden;text-overflow:ellipsis}.persona small{color:var(--muted);font-size:12.5px}
.av{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.sw{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:14px;padding:12px;font-weight:600}
.sw input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.rep .r,.det .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.rep h2+.r,.det .r:first-child{border-top:0}
.r span{color:var(--muted)}.r b{text-align:right;font-variant-numeric:tabular-nums}.r b.pos{color:var(--good)}.r b.neg{color:var(--bad)}
.txt{margin:0;color:var(--muted)}.txt.big{font-size:17px;color:var(--ink);margin:4px 0 10px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;background:var(--sun);color:var(--sun-i);padding:2px 8px;border-radius:8px}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 2px;text-align:left}
.ordbtn{align-self:flex-end;font-size:14px}
.prio-w{display:flex;align-items:center;gap:8px}.prio-w>:last-child{flex:1;min-width:0}
.num-p{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.orden-h{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.orden{display:flex;flex-direction:column;gap:8px;touch-action:none}
.oi{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:14px;padding:8px 10px;user-select:none}
.oi.drag{box-shadow:0 6px 18px rgba(40,30,90,.25);background:var(--lila)}
.oi-t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.handle{border:0;background:none;font-size:22px;cursor:grab;padding:4px 6px;color:var(--muted);touch-action:none}
.btn{border:0;font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px;width:100%;cursor:pointer;font-size:15.5px}
.btn.sm{width:auto;padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn.line{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
nav .in{display:flex;max-width:560px;width:100%;padding:6px 8px}
nav button{flex:1;border:0;background:none;font-size:12px;font-weight:700;color:var(--muted);padding:6px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px}
nav button.on{color:var(--accent);background:var(--lila)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,50,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet h2{font-family:var(--f-display);font-weight:600;margin:0 0 12px;font-size:22px}
.det-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}.det-h h2{margin:0}
.det{margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:14px;font-weight:700;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld input[type=email],.fld select{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:12px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none}
.fld.ck{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:16px}
.fld.ck input{width:24px;height:24px;accent-color:var(--accent)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:4px;background:var(--surface2);border-radius:10px;padding:8px 10px;color:var(--ink);font-size:14px}
.acts{display:flex;gap:8px;margin-top:8px}.acts .btn{flex:1}
.acts.col{flex-direction:column}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
.auth{max-width:440px;margin:0 auto;padding-block:36px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.auth h1{font-family:var(--f-display);font-weight:600;font-size:34px;margin:0;color:var(--accent)}
.muted{color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.card h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0 0 8px}
.empty{color:var(--muted);font-size:14.5px;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
</style></head><body>
<div class="app" id="app"><div class="auth"><h1>Casa en Orden</h1><div class="empty">Cargando…</div></div></div>
<nav id="nav"></nav><div id="layer"></div>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body></html>
