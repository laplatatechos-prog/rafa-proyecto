<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa en Orden</title>
<meta name="theme-color" content="#14213a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: app de una columna tipo celular, cabecera oscura, contenido en tarjetas, barra inferior fija */
:root{
  --bg:#f2f4f8;--surface:#ffffff;--surface2:#eaeef5;--ink:#14213a;--muted:#5a6880;--line:#dde3ec;
  --accent:#2a6fdb;--accent-ink:#ffffff;--head:#14213a;--head-ink:#f4f7fc;
  --good:#16804a;--warn:#a96300;--bad:#c2372a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131e;--surface:#151d2b;--surface2:#1c2638;--ink:#e7ecf4;--muted:#95a3b9;--line:#283347;
  --accent:#5b9bff;--accent-ink:#0b1220;--head:#090e17;--head-ink:#e7ecf4;
  --good:#3ccf80;--warn:#f0ad45;--bad:#ff6a5c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131e;--surface:#151d2b;--surface2:#1c2638;--ink:#e7ecf4;--muted:#95a3b9;--line:#283347;
  --accent:#5b9bff;--accent-ink:#0b1220;--head:#090e17;--head-ink:#e7ecf4;
  --good:#3ccf80;--warn:#f0ad45;--bad:#ff6a5c;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
header{background:var(--head);color:var(--head-ink);padding-block:18px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
header p{margin:2px 0 0;font-size:13px;opacity:.75}
header .grow{flex:1;min-width:0}
.who{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--head-ink) 12%,transparent);border:0;color:var(--head-ink);border-radius:20px;padding:4px 10px 4px 4px;font:inherit;font-size:13px;cursor:pointer}
main{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{font-family:var(--f-display);font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.card h3+.row,.card .row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .main b{font-weight:700}
.row .sub{display:block;color:var(--muted);font-size:12.5px}
.row.tap{cursor:pointer}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.tile .n{display:block;font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tag.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tag.adm{background:var(--ink);color:var(--surface)}
.bar{height:8px;background:var(--surface2);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:0;font:inherit;font-size:13px;padding:7px 12px;border-radius:16px;background:var(--surface2);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{border:0;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:12px;width:100%;cursor:pointer;font-size:14.5px}
.btn.ghost{background:transparent;color:var(--accent);border:2px dashed var(--accent)}
.btn.sm{width:auto;padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.line{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--accent-ink);font-weight:700;cursor:pointer;flex:none}
.chk.done{background:var(--good);border-color:var(--good)}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.note{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:9px 12px;font-size:13px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--muted);padding:9px 0 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-family:var(--f-display);margin:0 0 12px;font-size:19px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px;font-size:13px;color:var(--muted)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld input[type=time],.fld select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.fld.ck{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14.5px}
.fld.ck input{width:22px;height:22px}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:3px;background:var(--surface2);border-radius:8px;padding:6px 8px;color:var(--ink);font-size:13px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

.auth{max-width:420px;margin:0 auto;padding-block:40px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.auth h1{font-family:var(--f-display);font-size:30px;margin:0}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:11.5px;color:var(--muted);padding:2px 0}
.cal button{border:0;background:var(--surface2);border-radius:9px;min-height:44px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.35}
.cal button.today{outline:2px solid var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal button.sel .dots i{background:var(--accent-ink)}
.cal .dots i.p{background:var(--warn)}.cal .dots i.b{background:var(--bad)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calh b{font-family:var(--f-display);font-size:17px;text-transform:capitalize}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.12em;background:var(--surface2);padding:2px 8px;border-radius:6px}
</style></head><body>
<div class="app" id="app"><div class="auth"><h1>Casa en Orden</h1><div class="empty">Cargando…</div></div></div>
<nav id="nav"></nav><div id="layer"></div>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body></html>
