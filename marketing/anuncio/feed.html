<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1080px;font-family:'Montserrat','Arial Black',Arial,sans-serif;overflow:hidden}
.ad{position:relative;width:1080px;height:1080px;background:url(escena.svg) center/cover}
.top{position:absolute;top:0;left:0;right:0;padding:56px 60px 120px;background:linear-gradient(#0b2545f2 55%,#0b254500)}
.brand{color:#ff8c1a;font-weight:800;font-size:34px;letter-spacing:4px}
h1{color:#fff;font-size:92px;line-height:.95;font-weight:900;margin-top:14px;text-shadow:0 4px 18px #0006}
.price{position:absolute;right:50px;top:420px;background:#ff8c1a;color:#fff;border-radius:28px;padding:26px 40px;text-align:center;box-shadow:0 12px 40px #0007;transform:rotate(-4deg)}
.price b{display:block;font-size:118px;font-weight:900;line-height:1}
.price span{font-size:40px;font-weight:800}
.price small{display:block;font-size:26px;font-weight:700;margin-top:6px;opacity:.95}
.bottom{position:absolute;bottom:0;left:0;right:0;background:#0b2545f5;color:#fff;padding:34px 60px;display:flex;justify-content:space-between;align-items:center}
.bottom .l{font-size:34px;font-weight:800}.bottom .l small{display:block;font-size:26px;font-weight:600;color:#c9d6e8;margin-top:6px}
.wa{background:#25d366;border-radius:60px;padding:20px 34px;font-size:32px;font-weight:900}
</style></head><body><div class="ad">
<div class="top"><div class="brand">LA PLATA TECHOS</div><h1>COLOCACIÓN<br>DE CANALETAS</h1></div>
<div class="price"><b>$10.000</b><span>el metro</span><small>Mano de obra · Material aparte</small></div>
<div class="bottom"><div class="l">Presupuesto sin cargo<small>La Plata y alrededores</small></div><div class="wa">WhatsApp ➜</div></div>
</div></body></html>
