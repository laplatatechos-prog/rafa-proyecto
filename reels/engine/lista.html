<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lista de precios</title>
<style>
  /* ===== COLORES DE MARCA (provisorios hasta tener los de Isotech) ===== */
  :root{
    --azul:#0a3a7a; --azul2:#062451; --naranja:#f57c1f;
    --blanco:#ffffff; --gris:#b8c8e2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--azul2)}
  body{font-family:"Inter Display","Inter",sans-serif;color:var(--blanco)}
  #stage{position:absolute;inset:0;overflow:hidden;
    background:radial-gradient(1100px 1100px at 50% 45%, var(--azul) 0%, var(--azul2) 78%)}
  #grid{position:absolute;inset:0;opacity:.07;
    background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 90px),
               repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 90px)}
  .abs{position:absolute;left:0;right:0;text-align:center}

  #brand{top:140px;font-weight:900;font-size:60px;letter-spacing:10px}
  #brand span{color:var(--naranja)}
  #title{top:222px;font-weight:800;font-size:36px;letter-spacing:5px;color:var(--gris)}

  #stripe{position:absolute;left:0;right:0;top:290px;height:100px;background:var(--naranja);color:var(--azul2);
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:62px;letter-spacing:-1px}

  #list{position:absolute;left:60px;right:110px;top:420px}
  .row{position:relative;height:108px;display:flex;align-items:center;padding:0 26px;border-radius:22px;
    transform-origin:50% 50%}
  .row .hl{position:absolute;inset:0;border-radius:22px;background:var(--blanco);opacity:0}
  .row .bar{position:absolute;left:0;top:14px;bottom:14px;width:10px;border-radius:5px;background:var(--naranja);opacity:0}
  .row .txt{position:relative;flex:1;min-width:0}
  .row .n{font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.5px;text-transform:uppercase}
  .row .d{font-weight:600;font-size:25px;line-height:1.2;color:var(--gris);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .pr{position:relative;text-align:right;margin-left:18px}
  .row .p{font-weight:900;font-size:50px;letter-spacing:-1.5px;line-height:1}
  .row .u{font-weight:800;font-size:22px;color:var(--naranja);margin-top:4px;letter-spacing:.5px}
  .row + .row::before{content:"";position:absolute;left:26px;right:26px;top:0;height:2px;background:rgba(255,255,255,.1)}

  #foot{top:1530px;font-weight:800;font-size:34px;color:var(--gris)}
  #valid{top:1525px}
  #valid span{display:inline-block;border:5px solid var(--naranja);color:var(--naranja);border-radius:22px;
    padding:18px 36px;font-weight:900;font-size:50px;background:var(--azul2)}
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="abs" id="brand"></div>
  <div class="abs" id="title"></div>
  <div id="stripe">MATERIALES APARTE</div>
  <div id="list"></div>
  <div class="abs" id="foot">Precios desde · solo mano de obra · La Plata y AMBA</div>
  <div class="abs" id="valid"><span>Precios válidos hasta el 30/11</span></div>
</div>
<script>
// ===== DATOS: rubro, descripción, precio, unidad =====
const CFG = {
  brand: 'ISO<span>TECH</span>',
  title: 'MANO DE OBRA · NOVIEMBRE',
  intro: 2.6, per: 1.6, outro: 3.2,
  items: [
    ["Canaletas y zinguería",  "Canaleta de chapa galvanizada, bajadas y babetas", 8000,  "POR METRO"],
    ["Sobretecho",             "Chapa nueva sobre el techo existente",              28000, "POR M²"],
    ["Techo completo de chapa","Desarme, estructura reglamentaria y colocación",    32000, "POR M²"],
    ["Recambio de chapa",      "Retiro de chapa vieja y colocación de nueva",       15000, "POR M²"],
    ["Techo de tejas",         "Colocación de tejas",                               18000, "POR M²"],
    ["Membrana asfáltica",     "Impermeabilización de losas y terrazas",            14000, "POR M²"],
    ["Membrana líquida",       "Impermeabilizante líquido aplicado en capas",       10000, "POR M²"],
    ["Aislación bajo chapa",   "Aislante térmico contra calor y condensación",      7000,  "POR M²"],
    ["Goteras y filtraciones", "Detección del origen y reparación",                 30000, "POR TRABAJO"],
    ["Revisión y mantenimiento","Inspección del techo y mantenimiento preventivo",  25000, "POR VISITA"],
  ]
};
const $=id=>document.getElementById(id);
const fmt=n=>"$"+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
$("brand").innerHTML=CFG.brand; $("title").textContent=CFG.title;
$("list").innerHTML=CFG.items.map((it,i)=>`
  <div class="row" id="r${i}"><div class="hl"></div><div class="bar"></div>
    <div class="txt"><div class="n">${it[0]}</div><div class="d">${it[1]}</div></div>
    <div class="pr"><div class="p">${fmt(it[2])}</div><div class="u">${it[3]}</div></div></div>`).join("");

const N=CFG.items.length;
window.DURATION=CFG.intro+N*CFG.per+CFG.outro;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-x,3);
const sm=x=>x*x*(3-2*x);

window.setT=function(t){
  const a=eo(cl(t/0.45));
  $("brand").style.cssText=`opacity:${a};transform:translateY(${(1-a)*-40}px)`;
  const b=eo(cl((t-0.2)/0.45)); $("title").style.opacity=b;
  const s=eo(cl((t-0.4)/0.5)); $("stripe").style.transform=`translateX(${(1-s)*-1100}px)`;

  const hs=CFG.intro, he=hs+N*CFG.per;
  // índice resaltado con transición suave
  for(let i=0;i<N;i++){
    const el=$("r"+i), lt=t-(0.7+i*0.16);
    const ia=eo(cl(lt/0.4));                       // entrada en cascada
    // intensidad de resaltado: sube al entrar en su turno, baja al salir
    const t0=hs+i*CFG.per, k=sm(cl((t-t0)/0.25))*(1-sm(cl((t-(t0+CFG.per-0.05))/0.25)));
    const reading = t>=hs-0.1 && t<he+0.1;
    const dim = reading ? (1-k)*0.5 : 0;           // los demás se apagan mientras se lee uno
    el.style.opacity = ia*(1-dim);
    el.style.transform = `translateX(${(1-ia)*120}px) scale(${1+0.06*k})`;
    el.querySelector(".hl").style.opacity = k;
    el.querySelector(".bar").style.opacity = k;
    el.style.zIndex = k>0.01?2:1;
    const col = k>0.5 ? "var(--azul2)" : "var(--blanco)";
    el.querySelector(".n").style.color = col;
    el.querySelector(".p").style.color = k>0.5 ? "var(--azul)" : "var(--blanco)";
    el.querySelector(".d").style.color = k>0.5 ? "#4b5f80" : "var(--gris)";
  }
  // pie: leyenda durante la lectura, vigencia al final
  const v=eo(cl((t-he-0.2)/0.45));
  $("foot").style.opacity = eo(cl((t-2.2)/0.4))*(1-v);
  $("valid").style.opacity = v;
  $("valid").style.transform = `scale(${0.85+0.15*v})`;
  // al final: todo encendido con un pulso en la franja
  if(t>he){ $("stripe").style.transform=`scale(${1+0.03*Math.sin((t-he)*Math.PI*2/0.9)})`; }
};
window.READY=document.fonts.ready.then(()=>{setT(0);return true;});
</script>
</body>
</html>
