<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d1a2b">
<title>Tu presupuesto · La Plata Techos</title>
<meta name="description" content="Elegí cómo pagar, la fecha de obra y firmá desde el celular.">
<link rel="icon" href="../icon-192.png">
<style>
/* Página del cliente: bordó de la memoria técnica, gris de base y amarillo para lo que tiene que tocar */
:root{--azul:#6d1a2b;--azul2:#8c2a3d;--azul3:#eceef1;--amar:#ffc21a;--amar2:#ffd65c;--amar3:#fff7dc;--linea:#dfe2e6;--texto:#24272c;--suave:#5f6670;--fondo:#f3f4f6;--ok:#14804a;--sombra:0 1px 2px rgba(30,32,36,.06),0 8px 24px rgba(30,32,36,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hero{background:linear-gradient(150deg,var(--azul) 0%,var(--azul2) 100%);color:#fff;padding:22px 16px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--amar)}
.hero .in{max-width:640px;margin:auto;position:relative}
.marca{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:3px;font-size:20px}
.marca .logo{width:38px;height:38px;border-radius:10px;background:var(--amar);display:grid;place-items:center}
.marca small{display:block;font-size:11px;letter-spacing:1.5px;font-weight:700;color:#ecd6db}
.hero h1{font-size:26px;line-height:1.2;margin:20px 0 6px;font-weight:900}
.hero h1 span{color:var(--amar)}
.hero p{margin:0;color:#ecd6db;font-size:14px;line-height:1.5}
.hero .num{display:inline-block;margin-top:12px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.fotos{display:flex;gap:10px;overflow-x:auto;padding:16px;max-width:672px;margin:-2px auto 0;scroll-snap-type:x mandatory;scrollbar-width:none}
.fotos::-webkit-scrollbar{display:none}
.foto{flex:none;width:62%;max-width:260px;aspect-ratio:4/5;border-radius:16px;overflow:hidden;scroll-snap-align:start;position:relative;box-shadow:var(--sombra);background:#4a4f57}
.foto img,.foto svg{width:100%;height:100%;object-fit:cover;display:block}
.foto b{position:absolute;left:10px;bottom:10px;background:rgba(109,26,43,.88);color:#fff;font-size:12px;padding:5px 10px;border-radius:12px}
main{max-width:640px;margin:auto;padding:0 16px 120px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
.card h2{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--azul);margin:0 0 14px;font-weight:900;display:flex;align-items:center;gap:10px}
.card h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--amar);color:var(--azul);display:grid;place-items:center;font-size:13px;flex:none}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px}
.item:last-child{border-bottom:0}
.item small{display:block;color:var(--suave);font-size:12px;margin-top:2px}
.item b{white-space:nowrap;font-variant-numeric:tabular-nums}
.obs{background:var(--azul3);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--azul);margin-top:10px;white-space:pre-line}
.op{display:block;border:2px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.op input{position:absolute;opacity:0;pointer-events:none}
.op .t{font-weight:800;font-size:15px;padding-right:30px}
.op .m{font-size:26px;font-weight:900;color:var(--azul);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.op .d{font-size:13px;color:var(--suave);line-height:1.45}
.op .tag{display:inline-block;margin-right:28px;background:var(--amar);color:var(--azul);font-weight:900;font-size:11px;letter-spacing:.6px;padding:4px 9px;border-radius:10px;margin-bottom:8px}
.op::after{content:"";position:absolute;right:14px;top:14px;width:22px;height:22px;border-radius:50%;border:2px solid var(--linea);background:#fff}
.op.on{border-color:var(--azul2);background:linear-gradient(160deg,var(--amar3),#fff)}
.op.on::after{border-color:var(--azul2);background:var(--azul2);box-shadow:inset 0 0 0 4px #fff}
.cuotas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cuotas button{flex:1 1 30%;border:1.5px solid var(--linea);background:#fff;border-radius:12px;padding:9px 6px;font-size:13px;font-weight:700;color:var(--azul)}
.cuotas button small{display:block;font-weight:600;color:var(--suave);font-size:11px;margin-top:2px}
.cuotas button.on{background:#3d4249;border-color:#3d4249;color:#fff}.cuotas button.on small{color:#ecd6db}
label{display:block;font-size:12px;font-weight:800;color:var(--suave);margin:12px 0 5px}
label:first-of-type{margin-top:0}
input[type=text],input[type=tel],input[type=email],input[inputmode]{width:100%;border:1.5px solid var(--linea);border-radius:12px;padding:13px;font-size:16px;color:var(--texto);background:#fbfbfc;font-family:inherit}
input:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 4px rgba(255,194,26,.35);background:#fff}
.err{border-color:#c0392b!important}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h b{font-size:16px}
.cal-h button{border:0;background:var(--azul3);color:var(--azul2);width:40px;height:40px;border-radius:12px;font-size:20px;font-weight:800}
.cal-h button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dn{font-size:11px;font-weight:800;color:var(--suave);padding:4px 0}
.cal button{aspect-ratio:1;border:0;border-radius:11px;font-size:15px;font-weight:700;background:var(--azul3);color:var(--azul)}
.cal button:disabled{background:transparent;color:#bcc1c7;text-decoration:line-through;font-weight:500}
.cal button.vacio{visibility:hidden}
.cal button.on{background:var(--amar);color:var(--azul);box-shadow:0 0 0 2px var(--azul2)}
.ref{display:flex;gap:14px;font-size:12px;color:var(--suave);margin-top:10px;flex-wrap:wrap}
.ref span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--azul3)}
.ref span.x::before{background:#fff;border:1px solid #cdd1d6}
.ref span.s::before{background:var(--amar)}
.nota{font-size:13px;color:var(--suave);line-height:1.5;margin-top:10px}
.nota b{color:var(--azul)}
.firma{position:relative;border:2px dashed #bfc4ca;border-radius:14px;background:#fff;touch-action:none;height:190px}
.firma canvas{width:100%;height:100%;display:block;border-radius:12px}
.firma .ph{position:absolute;inset:0;display:grid;place-items:center;color:#a9aeb5;font-size:15px;pointer-events:none}
.firma .linea{position:absolute;left:20px;right:20px;bottom:40px;border-bottom:1.5px solid #d7dade;pointer-events:none}
.mini{border:0;background:none;color:var(--azul2);font-weight:800;font-size:13px;padding:8px 0;text-decoration:underline}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--texto);margin-top:14px;font-weight:600}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--azul2)}
.cond{font-size:12px;color:var(--suave);line-height:1.55;white-space:pre-line;background:var(--fondo);border-radius:12px;padding:10px 12px;margin-top:12px;max-height:160px;overflow:auto}
.barra{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.barra .in{max-width:640px;margin:auto;display:flex;align-items:center;gap:12px}
.barra .res{flex:1;font-size:12px;color:var(--suave);line-height:1.3;min-width:0}
.barra .res b{display:block;font-size:18px;color:var(--azul);font-variant-numeric:tabular-nums}
.btn{display:block;border:0;border-radius:14px;padding:15px 18px;font-size:15px;font-weight:900;letter-spacing:.3px;background:var(--amar);color:var(--azul);box-shadow:0 6px 16px rgba(255,194,26,.45);text-align:center;text-decoration:none;font-family:inherit}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.55}
.btn.az{background:#3d4249;color:#fff;box-shadow:0 6px 16px rgba(109,26,43,.3)}
.btn.wa{background:#25d366;color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.35)}
.full{width:100%;margin-top:10px}
.estado{text-align:center;padding:30px 18px}
.estado .ico{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:38px;background:var(--amar)}
.estado .ico.ok{background:var(--ok);color:#fff}
.estado h2{display:block;text-align:center;font-size:22px;letter-spacing:0;text-transform:none;color:var(--azul)}
.estado p{color:var(--suave);font-size:15px;line-height:1.55}
.pagar{background:var(--amar3);border:2px solid var(--amar);border-radius:14px;padding:12px 14px;text-align:left;margin:12px 0;font-size:14px;line-height:1.6}
.pagar .fila{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #f1e3b0;padding:6px 0}.pagar .fila:last-of-type{border-bottom:0}
.pagar .fila b{word-break:break-all}.pagar .cp{border:0;background:var(--azul);color:#fff;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;flex:none}
.btn.mp{background:#009ee3;color:#fff;box-shadow:0 6px 16px rgba(0,158,227,.35)}
.resumen{text-align:left;background:var(--azul3);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--azul);color:#fff;padding:12px 18px;border-radius:22px;font-size:14px;display:none;z-index:30;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cargando{text-align:center;padding:60px 20px;color:var(--suave)}
.pie{text-align:center;font-size:12px;color:var(--suave);padding:6px 0 20px}
</style>
</head>
<body>
<div class="hero"><div class="in">
  <div class="marca"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M2 12 12 4l10 8" fill="none" stroke="#6d1a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11v8h14v-8" fill="none" stroke="#6d1a2b" stroke-width="2.2" stroke-linejoin="round"/></svg></div><div><span id="hEmp">TPL</span><small>LA PLATA TECHOS</small></div></div>
  <h1 id="hTit">Tu presupuesto, <span>listo para confirmar</span></h1>
  <p id="hSub">Elegí cómo pagar, la fecha de obra y firmá desde el celular. Tarda 2 minutos.</p>
  <span class="num" id="hNum" hidden></span>
</div></div>
<div class="fotos" id="fotos"></div>
<main id="app"><div class="cargando">Cargando tu presupuesto…</div></main>
<div class="barra" id="barra" hidden><div class="in"><div class="res" id="bRes"></div><button class="btn" id="bOk">ACEPTAR Y FIRMAR</button></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=x=>'$ '+Math.round(x).toLocaleString('es-AR');
const fmtQ=q=>(Math.round(q*100)/100).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
const SB='https://hvgwikhzxxkhmbjnyohl.supabase.co/rest/v1',KEY='sb_publishable_xUj53gV1c6xo6Y6t52R-Vw_hTS-P29s';
async function api(path,opt={}){const r=await fetch(SB+path,Object.assign({cache:'no-store'},opt,{headers:Object.assign({apikey:KEY,'Content-Type':'application/json'},opt.headers||{})}));if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}const t=await r.text();return t?JSON.parse(t):null}
const rpc=(fn,args)=>api('/rpc/'+fn,{method:'POST',body:JSON.stringify(args||{})});

/* Fechas en hora de Argentina, como texto AAAA-MM-DD para no pelear con husos */
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const deYmd=s=>{const [a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const hoyAR=()=>deYmd(new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}));
const sumar=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const largo=s=>deYmd(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});

/* Fotos de obras: se cargan en Admin TPL (clave "fotos": links separados por coma). Mientras, dibujos de muestra. */
const MUESTRA=[['Canaleta y bajada','#4a4f57','#6b7078'],['Techo de chapa','#6d1a2b','#8c2a3d'],['Zinguería a medida','#3d4249','#5f6670'],['Impermeabilización','#5a1423','#7d2033']];
function dibujo(t,c1,c2,i){const techo=['M0 150 L160 50 L320 150 Z','M0 140 L320 70 L320 150 L0 150 Z','M0 150 L90 60 L230 60 L320 150 Z','M0 120 L320 120 L320 150 L0 150 Z'][i%4];
 return `<svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs><rect width="320" height="240" fill="url(#g${i})"/><circle cx="262" cy="52" r="24" fill="#ffc21a" opacity=".9"/><g transform="translate(0,30)"><path d="${techo}" fill="#ffc21a" opacity=".95"/><rect x="40" y="150" width="240" height="60" fill="#eceef1" opacity=".9"/><rect x="40" y="148" width="240" height="7" fill="#a9adb4"/><rect x="268" y="150" width="7" height="60" fill="#a9adb4"/><rect x="70" y="168" width="34" height="28" fill="#6d1a2b" opacity=".55"/><rect x="200" y="168" width="34" height="28" fill="#6d1a2b" opacity=".55"/><rect x="138" y="166" width="40" height="44" fill="#6d1a2b" opacity=".7"/></g></svg><b>${esc(t)}</b>`}
const FOTOS=[['fotos/obra1.jpg','Canaleta americana con color'],['fotos/obra2.jpg','Canaleta cenefa con color'],['fotos/obra3.jpg','Canaleta americana sin color']];
function pintarFotos(cfg){const extra=String(cfg.fotos||'').split(/[\s,]+/).filter(u=>/^https:\/\//.test(u)).map(u=>[u,'']),urls=FOTOS.concat(extra).slice(0,12);
 $('fotos').innerHTML=urls.length?urls.map(([u,t],i)=>`<div class="foto"><img src="${esc(u)}" alt="${esc(t||'Obra '+(i+1))}" loading="lazy">${t?`<b>${esc(t)}</b>`:''}</div>`).join(''):MUESTRA.map((m,i)=>`<div class="foto">${dibujo(m[0],m[1],m[2],i)}</div>`).join('')}

/* ---------- Datos ---------- */
const q=new URLSearchParams(location.search),ID=q.get('id')||'',DEMO=q.get('demo')==='1';
let P=null,C={},OCUP=new Set(),sel={forma:'anticipo',cuotas:0,fecha:'',firma:false},mes=null;
const DEMO_P={id:'demo',num:'R-0002',vend:'Rafael',cli:'Juan Pérez',created_at:new Date().toISOString(),data:{cli:'Juan Pérez',tel:'221 555 1234',dir:'Calle 69 506, La Plata',vend:'Rafael',vtel:'221 5599 225',fecha:new Date().toISOString(),obs:'Se retira la canaleta vieja. Incluye prueba de caudal.',items:[{nom:'Canaleta cenefa 40 desarrollo',uni:'m',q:10,pre:25000},{nom:'Babeta 20 desarrollo',uni:'m',q:40,pre:5999},{nom:'Bajada de 2x4',uni:'m',q:6,pre:15000},{nom:'Pintado de canaleta',uni:'gl',q:1,pre:30000}],total:609960}};
const DEMO_C={alias:'laplatatechos',cvu:'0000003100041955043982',titular:'Angel Rafael Igoa',mplink:'https://mpago.la/1t17CkV',emp:'TPL',pct:20,anticipo:50,dias:5,round:true,planes:'3=25,6=40,12=70,18=100',gar:'Garantía TPL de 24 meses por escrito.'};

async function cargar(){
 try{
  if(DEMO){P=DEMO_P;C=DEMO_C;const h=hoyAR();[3,4,8,11].forEach(n=>OCUP.add(ymd(sumar(h,n))));return pantalla()}
  if(!ID)return estado('🔗','Link incompleto','Pedile a tu vendedor que te mande el link de nuevo.');
  const [rows,conf,ocu,ya]=await Promise.all([api('/presupuestos?select=id,num,vend,cli,created_at,data&id=eq.'+encodeURIComponent(ID)),api('/config?select=data&id=eq.1'),rpc('dias_ocupados').catch(()=>[]),rpc('aceptacion_estado',{p_pres_id:ID}).catch(()=>null)]);
  P=rows&&rows[0];if(!P)return estado('🔍','No encontramos este presupuesto','Puede que el link esté mal copiado. Pedile a tu vendedor que te lo reenvíe.');
  C=Object.assign({alias:'laplatatechos',cvu:'0000003100041955043982',titular:'Angel Rafael Igoa',mplink:'https://mpago.la/1t17CkV',pct:20,anticipo:50,dias:5,round:true,planes:'3=25,6=40,12=70,18=100',gar:'Garantía TPL de 24 meses por escrito.'},conf&&conf[0]?conf[0].data:{},P.data.cfgSnap||{});
  (ocu||[]).forEach(r=>OCUP.add(typeof r==='string'?r:r.dias_ocupados));
  if(ya)return aceptado(ya);
  pantalla();
 }catch(e){estado('📶','No pudimos cargar el presupuesto','Revisá tu conexión a internet y volvé a abrir el link.',true)}
}

/* ---------- Cuentas (las mismas que la app del vendedor) ---------- */
const qtyEff=it=>C.round!==false&&it.uni==='m'?Math.ceil(it.q-1e-9):it.q;
function planes(){return String(C.planes||'').split(/[,;\n]+/).map(x=>x.split(/[=:]/).map(v=>Number(String(v).trim()))).filter(([n,r])=>n>1&&n<=48&&r>=0).map(([n,r])=>({n:Math.round(n),r})).sort((a,b)=>a.n-b.n)}
function cuentas(){const fin=Number(P.data.total)||P.data.items.reduce((s,it)=>s+qtyEff(it)*it.pre,0),p=Math.min(90,Math.max(0,Number(C.pct)||0))/100,lista=p?fin/(1-p):fin,ant=Number(C.anticipo)||50;
 return{fin,lista,ant,sena:Math.round(fin)*ant/100,planes:planes().map(x=>{const tot=Math.round(lista*(1+x.r/100));return{n:x.n,tot,cuota:Math.round(tot/x.n)}})}}
const vence=()=>sumar(deYmd(new Date(P.data.fecha||P.created_at).toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'})),Number(C.dias??5));
const telWa=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return '';if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);if(d.startsWith('9'))d=d.slice(1);d=d.replace(/^(\d{2,4})15/,'$1');return '549'+d};
const waVend=txt=>{const n=telWa(P.data.vtel||C.etel);return 'https://wa.me/'+n+'?text='+encodeURIComponent(txt)};

/* ---------- Pantallas ---------- */
function cabecera(){$('hEmp').textContent=C.emp||'TPL';$('hTit').innerHTML=`${esc((P.data.cli||'').trim().split(/\s+/)[0]||'Hola')}, tu presupuesto <span>está listo</span>`;$('hNum').hidden=false;$('hNum').textContent=`Presupuesto N° ${P.num||''} · Vendedor: ${P.vend||P.data.vend||''}`;pintarFotos(C)}
function estado(ico,t,txt,reintentar){$('barra').hidden=true;$('app').innerHTML=`<div class="card estado"><div class="ico">${ico}</div><h2>${esc(t)}</h2><p>${esc(txt)}</p>${reintentar?'<button class="btn az full" onclick="location.reload()">Reintentar</button>':''}${P?`<a class="btn wa full" href="${waVend('Hola, te escribo por el presupuesto N° '+(P.num||''))}">Escribirle al vendedor por WhatsApp</a>`:''}</div>`}
function aceptado(a){cabecera();$('barra').hidden=true;
 $('app').innerHTML=`<div class="card estado"><div class="ico ok">✓</div><h2>¡Presupuesto aceptado!</h2><p>Ya tenemos tu firma y tus datos. Fecha elegida: <b>${largo(a.fecha_obra)}</b>.</p><p>${a.forma==='anticipo'?'La fecha queda reservada cuando recibimos el anticipo.':'Te confirmamos la fecha por WhatsApp.'}</p><a class="btn wa full" href="${waVend('Hola, acepté el presupuesto N° '+(P.num||'')+'.')}">Escribirle al vendedor</a></div>`}

function pantalla(){cabecera();
 if(vence()<hoyAR())return estado('⏰','Este presupuesto venció',`Era válido hasta el ${vence().toLocaleDateString('es-AR')}. Escribile a tu vendedor y te lo actualiza en el momento.`);
 const t=cuentas(),d=P.data;if(!t.planes.length&&sel.forma==='tarjeta')sel.forma='anticipo';
 if(!sel.cuotas&&t.planes.length)sel.cuotas=t.planes[0].n;
 const minD=sumar(hoyAR(),Number(C.minDias??2));if(!mes)mes=new Date(minD.getFullYear(),minD.getMonth(),1);
 $('app').innerHTML=`
 <div class="card"><h2><i>1</i>El trabajo</h2>
  ${(d.items||[]).map(it=>`<div class="item"><div>${esc(it.nom)}<small>${fmtQ(qtyEff(it))} ${esc(it.uni||'')}</small></div><b>${fmt(qtyEff(it)*it.pre)}</b></div>`).join('')}
  ${d.dir?`<div class="nota">Obra en: <b>${esc(d.dir)}</b></div>`:''}
  ${d.obs?`<div class="obs">${esc(d.obs)}</div>`:''}
  <div class="nota">Válido hasta el <b>${vence().toLocaleDateString('es-AR')}</b>. Incluye materiales y mano de obra.</div>
 </div>
 <div class="card" id="pago"></div>
 <div class="card"><h2><i>3</i>Tus datos</h2>
  <label for="fNom">Nombre y apellido</label><input type="text" id="fNom" autocomplete="name" value="${esc(d.cli||'')}">
  <label for="fDni">DNI</label><input id="fDni" inputmode="numeric" maxlength="10" placeholder="Sin puntos">
  <label for="fTel">Celular</label><input type="tel" id="fTel" autocomplete="tel" value="${esc(d.tel||'')}">
  <label for="fDir">Dirección de la obra</label><input type="text" id="fDir" autocomplete="street-address" value="${esc(d.dir||'')}">
  <label for="fMail">Mail (opcional)</label><input type="email" id="fMail" autocomplete="email">
 </div>
 <div class="card"><h2><i>4</i>Elegí la fecha de obra</h2>
  <div class="cal-h"><button type="button" id="mAnt" aria-label="Mes anterior">‹</button><b id="mTit"></b><button type="button" id="mSig" aria-label="Mes siguiente">›</button></div>
  <div class="cal" id="cal"></div>
  <div class="ref"><span>Libre</span><span class="x">Ocupado</span><span class="s">Tu fecha</span></div>
  <div class="nota" id="fNota"></div>
 </div>
 <div class="card"><h2><i>5</i>Firmá con el dedo</h2>
  <div class="firma" id="firma"><canvas id="cv"></canvas><div class="linea"></div><div class="ph" id="ph">Firmá acá</div></div>
  <button type="button" class="mini" id="bBorrar">Borrar firma</button>
  <div class="cond">${esc(condiciones(t))}</div>
  <label class="check"><input type="checkbox" id="fAcepto"><span>Acepto el presupuesto, la forma de pago elegida y las condiciones.</span></label>
 </div>
 <div class="pie">${esc(C.emp||'TPL')} · La Plata Techos${C.etel?' · '+esc(C.etel):''}</div>`;
 pintarPago();
 $('mAnt').onclick=()=>{mes=new Date(mes.getFullYear(),mes.getMonth()-1,1);pintarCal()};
 $('mSig').onclick=()=>{mes=new Date(mes.getFullYear(),mes.getMonth()+1,1);pintarCal()};
 pintarCal();firma();barra();
}
function pintarPago(){const t=cuentas();$('pago').innerHTML=`<h2><i>2</i>Elegí cómo pagar</h2>
  <label class="op ${sel.forma==='anticipo'?'on':''}" data-f="anticipo"><span class="tag">★ MEJOR PRECIO · EFECTIVO O TRANSFERENCIA</span><div class="t">Con ${t.ant}% de anticipo</div><div class="m">${fmt(t.fin)}</div><div class="d">Hoy dejás <b>${fmt(t.sena)}</b> y te reservamos la fecha. El resto (${fmt(t.fin-t.sena)}) lo pagás al terminar, cuando estás conforme.</div></label>
  <label class="op ${sel.forma==='final'?'on':''}" data-f="final"><div class="t">Todo al finalizar</div><div class="m">${fmt(t.lista)}</div><div class="d">Efectivo o transferencia cuando terminamos. La fecha se confirma según disponibilidad.</div></label>
  ${t.planes.length?`<label class="op ${sel.forma==='tarjeta'?'on':''}" data-f="tarjeta"><div class="t">Con tarjeta de crédito</div><div class="m">${(()=>{const x=t.planes.find(p=>p.n===sel.cuotas)||t.planes[0];return x.n+' × '+fmt(x.cuota)})()}</div><div class="d">Por Mercado Pago, al finalizar la obra.</div>
   <div class="cuotas">${t.planes.map(x=>`<button type="button" data-c="${x.n}" class="${x.n===sel.cuotas?'on':''}">${x.n} cuotas<small>${fmt(x.cuota)}</small></button>`).join('')}</div></label>`:''}
  <div class="nota">Ahorrás <b>${fmt(t.lista-t.fin)}</b> eligiendo el anticipo.</div>
 `;
 $('pago').querySelectorAll('.op').forEach(el=>el.onclick=e=>{e.preventDefault();const c=e.target.closest('[data-c]');if(c)sel.cuotas=Number(c.dataset.c);sel.forma=el.dataset.f;pintarPago();pintarCal();barra()})}
function condiciones(t){return [
 `Formas de pago: con ${t.ant}% de anticipo en efectivo o transferencia (el anticipo reserva la fecha y el saldo se paga al finalizar, contra conformidad); pago total al finalizar en efectivo o transferencia; o con tarjeta de crédito en cuotas por Mercado Pago al finalizar.`,
 'La fecha elegida queda sujeta a confirmación por WhatsApp. Puede correrse por lluvia o mal tiempo.',
 C.gar||'',
 `Precios válidos hasta el ${vence().toLocaleDateString('es-AR')}.`].filter(Boolean).join('\n')}


function pintarCal(){const minD=sumar(hoyAR(),Number(C.minDias??2)),maxD=sumar(hoyAR(),Number(C.maxDias??90));
 {const t=mes.toLocaleDateString('es-AR',{month:'long',year:'numeric'});$('mTit').textContent=t[0].toUpperCase()+t.slice(1)}
 $('mAnt').disabled=mes<=new Date(minD.getFullYear(),minD.getMonth(),1);$('mSig').disabled=new Date(mes.getFullYear(),mes.getMonth()+1,1)>maxD;
 const ini=(mes.getDay()+6)%7,n=new Date(mes.getFullYear(),mes.getMonth()+1,0).getDate();let h=['L','M','M','J','V','S','D'].map(x=>`<div class="dn">${x}</div>`).join('');
 for(let i=0;i<ini;i++)h+='<button class="vacio" disabled></button>';
 for(let i=1;i<=n;i++){const d=new Date(mes.getFullYear(),mes.getMonth(),i),s=ymd(d),no=d<minD||d>maxD||d.getDay()===0||OCUP.has(s);h+=`<button type="button" data-d="${s}" ${no?'disabled':''} class="${s===sel.fecha?'on':''}">${i}</button>`}
 $('cal').innerHTML=h;$('cal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel.fecha=b.dataset.d;pintarCal();barra()});
 $('fNota').innerHTML=sel.fecha?`Elegiste el <b>${largo(sel.fecha)}</b>. ${sel.forma==='anticipo'?'Queda reservada al recibir el anticipo.':'Te la confirmamos por WhatsApp.'}`:'Tocá un día libre. Los domingos y los días tachados ya están tomados.'}

/* Firma con el dedo: se guarda como imagen PNG */
let trazos=0;
function firma(){const cv=$('cv'),box=$('firma'),r=Math.min(2,window.devicePixelRatio||1);cv.width=box.clientWidth*r;cv.height=box.clientHeight*r;const g=cv.getContext('2d');g.scale(r,r);g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#6d1a2b';trazos=0;sel.firma=false;
 let ab=false,lx=0,ly=0;const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{ab=true;cv.setPointerCapture(e.pointerId);[lx,ly]=pos(e);g.beginPath();g.arc(lx,ly,1.2,0,7);g.fillStyle='#6d1a2b';g.fill();$('ph').style.display='none'};
 cv.onpointermove=e=>{if(!ab)return;const [x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;if(++trazos>15&&!sel.firma){sel.firma=true;barra()}};
 cv.onpointerup=cv.onpointercancel=()=>{ab=false};
 $('bBorrar').onclick=()=>{g.clearRect(0,0,cv.width,cv.height);trazos=0;sel.firma=false;$('ph').style.display='grid';barra()};
}
function firmaPng(){const cv=$('cv'),o=document.createElement('canvas'),w=600,h=Math.round(600*cv.height/cv.width);o.width=w;o.height=h;const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(cv,0,0,w,h);return o.toDataURL('image/png')}

function montoSel(){const t=cuentas();if(sel.forma==='anticipo')return{tot:t.fin,txt:`Anticipo hoy ${fmt(t.sena)}`};if(sel.forma==='final')return{tot:t.lista,txt:'Todo al finalizar'};const x=t.planes.find(p=>p.n===sel.cuotas)||t.planes[0];return{tot:x.tot,txt:`${x.n} cuotas de ${fmt(x.cuota)}`}}
function barra(){const m=montoSel();$('barra').hidden=false;$('bRes').innerHTML=`<b>${fmt(m.tot)}</b>${esc(m.txt)}${sel.fecha?' · '+deYmd(sel.fecha).toLocaleDateString('es-AR',{day:'numeric',month:'short'}):''}`}

const ERR={ya_aceptado:'Este presupuesto ya fue aceptado.',vencido:'El presupuesto venció. Pedile al vendedor que lo actualice.',forma:'Elegí una forma de pago.',cuotas:'Elegí la cantidad de cuotas.',nombre:'Revisá tu nombre y apellido.',dni:'Revisá el DNI (solo números).',tel:'Revisá el celular.',dir:'Falta la dirección de la obra.',email:'Revisá el mail.',fecha:'Esa fecha no está disponible. Elegí otra.',ocupado:'Esa fecha se acaba de ocupar. Elegí otra.',firma:'Falta la firma.',no_existe:'No encontramos el presupuesto.'};
function marcar(id,msg){const el=$(id);if(el){el.classList.add('err');el.scrollIntoView({behavior:'smooth',block:'center'});el.oninput=()=>el.classList.remove('err')}toast(msg);return false}
function validar(){const v=k=>$(k).value.trim();
 if(v('fNom').length<3)return marcar('fNom',ERR.nombre);
 if(!/^\d{7,9}$/.test(v('fDni').replace(/\D/g,'')))return marcar('fDni',ERR.dni);
 const tl=v('fTel').replace(/\D/g,'').length;if(tl<6||tl>15)return marcar('fTel',ERR.tel);
 if(v('fDir').length<3)return marcar('fDir',ERR.dir);
 if(v('fMail')&&!/^\S+@\S+\.\S+$/.test(v('fMail')))return marcar('fMail',ERR.email);
 if(!sel.fecha)return marcar('cal','Elegí la fecha de obra.');
 if(!sel.firma)return marcar('firma',ERR.firma);
 if(!$('fAcepto').checked)return marcar('fAcepto','Marcá que aceptás el presupuesto.');
 return true}
$('bOk').onclick=async()=>{if(!validar())return;const b=$('bOk');b.disabled=true;b.textContent='Enviando…';
 const body={pres_id:P.id,forma:sel.forma,cuotas:sel.forma==='tarjeta'?sel.cuotas:null,nombre:$('fNom').value.trim(),dni:$('fDni').value.replace(/\D/g,''),tel:$('fTel').value.trim(),dir:$('fDir').value.trim(),email:$('fMail').value.trim(),fecha_obra:sel.fecha,firma:firmaPng()};
 try{const r=DEMO?{ok:true}:await rpc('aceptar_presupuesto',{p:body});
  if(!r||!r.ok){const e=r&&r.err;if(e==='ocupado'||e==='fecha'){OCUP.add(sel.fecha);sel.fecha='';pintarCal();barra();marcar('cal',ERR[e])}else if(e==='ya_aceptado'){aceptado({fecha_obra:body.fecha_obra,forma:body.forma})}else toast(ERR[e]||'No se pudo enviar. Probá de nuevo.');return}
  listo(body)}
 catch(e){toast('Sin conexión. Revisá internet y tocá de nuevo.')}
 finally{b.disabled=false;b.textContent='ACEPTAR Y FIRMAR'}};

function listo(b){const t=cuentas(),m=montoSel();$('barra').hidden=true;scrollTo(0,0);
 const forma=b.forma==='anticipo'?`Anticipo ${t.ant}%: ${fmt(t.sena)} (saldo ${fmt(t.fin-t.sena)} al finalizar)`:b.forma==='final'?`Todo al finalizar: ${fmt(t.lista)}`:m.txt+` (total ${fmt(m.tot)})`;
 const msg=`Hola, acepté y firmé el presupuesto N° ${P.num||''}.\nForma de pago: ${forma}.\nFecha elegida: ${largo(b.fecha_obra)}.\n${b.nombre} · ${b.dir}`;
 $('app').innerHTML=`<div class="card estado"><div class="ico ok">✓</div><h2>¡Listo, ${esc(b.nombre.split(/\s+/)[0])}!</h2><p>Recibimos tu firma y tus datos.</p>
  <div class="resumen"><b>Pago:</b> ${esc(forma)}<br><b>Fecha:</b> ${esc(largo(b.fecha_obra))}<br><b>Obra:</b> ${esc(b.dir)}</div>
  ${b.forma==='anticipo'?(C.alias||C.cvu?`<p>Para reservar la fecha, transferí el anticipo de <b>${fmt(t.sena)}</b> y mandanos el comprobante.</p><div class="pagar">${C.alias?`<div class="fila"><span>Alias<br><b>${esc(C.alias)}</b></span><button class="cp" data-cp="${esc(C.alias)}">Copiar</button></div>`:''}${C.cvu?`<div class="fila"><span>CVU<br><b>${esc(C.cvu)}</b></span><button class="cp" data-cp="${esc(C.cvu)}">Copiar</button></div>`:''}${C.titular?`<div class="fila"><span>Titular<br><b>${esc(C.titular)}</b></span></div>`:''}<div class="fila"><span>Monto<br><b>${fmt(t.sena)}</b></span><button class="cp" data-cp="${Math.round(t.sena)}">Copiar</button></div></div>${/^https:\/\//.test(C.mplink||'')?`<a class="btn mp full" href="${esc(C.mplink)}" target="_blank" rel="noopener">Pagar con Mercado Pago</a>`:''}`:`<p>Para reservar la fecha, coordiná el anticipo de <b>${fmt(t.sena)}</b> con tu vendedor.</p>`):'<p>Te confirmamos la fecha por WhatsApp.</p>'}
  <a class="btn wa full" href="${waVend(msg+(b.forma==='anticipo'?'\nTe mando el comprobante del anticipo.':''))}">${b.forma==='anticipo'?'Mandar comprobante por WhatsApp':'Avisarle al vendedor por WhatsApp'}</a></div>`;
 $('app').querySelectorAll('[data-cp]').forEach(x=>x.onclick=()=>{const v=x.dataset.cp;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiado: '+v)).catch(()=>prompt('Copiá:',v))})}

cargar();
</script>
</body>
</html>
