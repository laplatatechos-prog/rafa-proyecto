name: App Android (burbuja)
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk tpl-burbuja.apk
      - uses: actions/upload-artifact@v4
        with: { name: tpl-burbuja, path: android/tpl-burbuja.apk }
      - name: Publicar APK para descargar desde el celular
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: burbuja-latest
          name: TPL Burbuja (última versión)
          body: "Abrí este link desde el celular Android, descargá tpl-burbuja.apk e instalalo."
          files: android/tpl-burbuja.apk
          make_latest: true
