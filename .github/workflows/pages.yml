name: Tablero web
# Publica web/ en la carpeta obras/ de la rama gh-pages, sin tocar el resto del sitio
# (ahí vive el sistema de presupuestos). URL: https://laplatatechos-prog.github.io/rafa-proyecto/obras/
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: gh-pages-obras, cancel-in-progress: false }

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - name: Copiar web/ a obras/
        run: |
          rm -rf site/obras
          mkdir -p site/obras
          cp -r src/web/. site/obras/
      - name: Commit y push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add obras
          git diff --cached --quiet && exit 0
          git commit -m "Tablero de obras: ${GITHUB_SHA::7}"
          git push origin gh-pages
